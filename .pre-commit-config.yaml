# Hooks Git d'AgriScan AI — voir docs/DEV_HOOKS.md (installation, dépannage, limites).
#
# Deux étapes :
#   - pre-commit : rapide (quelques secondes), uniquement sur les fichiers indexés ;
#   - pre-push   : tests des composants modifiés (ML, API, Flutter). Jamais d'entraînement ni de
#                  téléchargement de données dans un hook.
# Les hooks locaux NE REMPLACENT PAS une intégration continue ni une revue de code.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &generated '^(AGENTS\.md$|mobile/(android|ios)/|mobile/lib/l10n/app_localizations.*\.dart$|mobile/pubspec\.lock$|ml/data/)'
      - id: end-of-file-fixer
        exclude: *generated
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files   # bloque les modèles (.keras), jeux de données, archives
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '^mobile/\.metadata$'
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Lint seulement (pas de reformatage automatique du code existant) ; la configuration est
      # lue dans ml/pyproject.toml et backend/pyproject.toml.
      - id: ruff-check
        files: '^(ml|backend)/'
        exclude: '(^|/)\.venv/'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2   # règles dans .markdownlint-cli2.yaml (nécessite Node.js)
        exclude: '^(AGENTS\.md$|mobile/(android|ios)/|\.obsidian/)'

  - repo: local
    hooks:
      - id: forbid-secret-files
        name: interdire .env, clés et fichiers de secrets
        language: fail
        entry: "Fichier sensible interdit dans Git (voir docs/SECURITY.md). Utiliser un fichier .example sans valeurs."
        files: '(^|/)(\.env(\..+)?|key\.properties|google-services\.json|GoogleService-Info\.plist|jwt_secret|[^/]+\.(jks|keystore|pem|p12|pfx))$'
        exclude: '\.env\.example$'

      - id: ml-tests
        name: tests ML (pytest)
        language: system
        entry: python scripts/hooks/run_component_checks.py ml
        files: '^ml/.*\.(py|toml|txt)$'
        exclude: '^ml/data/'
        pass_filenames: false
        stages: [pre-push]

      - id: backend-tests
        name: tests API (pytest, PostgreSQL embarqué)
        language: system
        entry: python scripts/hooks/run_component_checks.py backend
        files: '^backend/.*\.(py|toml|txt|ini|mako)$'
        pass_filenames: false
        stages: [pre-push]

      - id: mobile-checks
        name: Flutter (analyze + test)
        language: system
        entry: python scripts/hooks/run_component_checks.py mobile
        files: '^mobile/(lib|test|pubspec\.yaml|l10n\.yaml)'
        pass_filenames: false
        stages: [pre-push]
